<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1830"/>
      <stop offset="0.55" stop-color="#0A1120"/>
      <stop offset="1" stop-color="#070B14"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#2F8CFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2F8CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#BFE3FF"/>
      <stop offset="1" stop-color="#57B8FF"/>
    </linearGradient>
    <linearGradient id="sparkSmall" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#57B8FF"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- full-bleed background (maskable safe zone: sparkle stays within center 80%) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- main sparkle -->
  <path d="M256 96 C 268 200, 316 244, 416 256 C 316 268, 268 316, 256 416 C 244 316, 196 268, 96 256 C 196 244, 244 200, 256 96 Z"
        fill="url(#spark)" filter="url(#soft)" opacity="0.55"/>
  <path d="M256 96 C 268 200, 316 244, 416 256 C 316 268, 268 316, 256 416 C 244 316, 196 268, 96 256 C 196 244, 244 200, 256 96 Z"
        fill="url(#spark)"/>

  <!-- small accents -->
  <path d="M140 148 C 146 182, 162 198, 196 204 C 162 210, 146 226, 140 260 C 134 226, 118 210, 84 204 C 118 198, 134 182, 140 148 Z"
        fill="url(#sparkSmall)" opacity="0.9"/>
  <path d="M380 348 C 384 372, 398 386, 422 390 C 398 394, 384 408, 380 432 C 376 408, 362 394, 338 390 C 362 386, 376 372, 380 348 Z"
        fill="url(#sparkSmall)" opacity="0.75"/>

  <!-- circuit dots -->
  <circle cx="336" cy="160" r="7" fill="#20D6B5" opacity="0.9"/>
  <circle cx="176" cy="356" r="5" fill="#2F8CFF" opacity="0.8"/>
</svg>
